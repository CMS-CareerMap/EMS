# /etc/nginx/sites-available/ems  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
#
# One address for everything: the React build as files, and /api passed to
# Node on the same machine. Same origin, so there is no CORS and the refresh
# cookie (SameSite=Lax, Path=/api/auth) works as designed.
#
# The certificate must exist BEFORE this file is enabled — nginx refuses to
# load a `listen … ssl` server without one. DEPLOY.md step 8 gets it first,
# with the small HTTP-only file beside this one, then switches to this.
#
# Replace hr.example.com with the real domain everywhere below (sed in step 8).
# Written for the nginx Ubuntu 24.04 ships (1.24): `listen … http2`, not the
# newer `http2 on;`.

server {
    listen 80;
    listen [::]:80;
    server_name hr.example.com;
    server_tokens off;

    # Certificate renewals (certbot renew, webroot /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ems_ssl:10m;
    ssl_session_timeout 1d;

    # The built web app (npm run build in web/).
    root /srv/ems/web/dist;

    # The API refuses anything over its own limit (Settings → Documents, at
    # most 10 MB); this only has to be larger than that plus the form around it.
    client_max_body_size 12m;

    # The app's own code and styles, compressed: about 430 KB on a first visit
    # otherwise, which is slow on a phone. API answers are left as they are —
    # they carry tokens, and they are small.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # The API. helmet sets its security headers; none are added here.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts exactly one proxy — this one — so req.ip is the
        # visitor's address, which the sign-in limits are counted by.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built files carry a hash in their names, so they never change: cached for
    # a year. A missing one is a real 404 — never index.html, which a browser
    # would try to run as a script and fail on confusingly.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ems-security-headers.conf;
    }

    # Any other address is the app itself (it has its own "no page here").
    # index.html is never cached, so a deploy is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ems-security-headers.conf;
    }

    # Dot-files (.env, .git) are never served, whatever lands in the folder.
    location ~ /\. {
        deny all;
        return 404;
    }
}
