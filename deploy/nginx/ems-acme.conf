# /etc/nginx/sites-available/ems-acme — used ONCE, before the first
# certificate exists (DEPLOY.md step 8): port 80 only, answering Let's
# Encrypt's check and nothing else. Removed as soon as ems.conf takes over.

server {
    listen 80;
    listen [::]:80;
    server_name hr.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
