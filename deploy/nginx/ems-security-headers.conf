# Security headers for the web app's own files — index.html and its assets.
# Included in each static location of ems.conf, NOT at server level: nginx
# drops server-level add_header lines in any location that adds its own, and
# the API (/api/) sets these itself through helmet. Two copies of a header on
# one response can contradict each other.
#
# The local test server (scratchpad serve-prod) reads this very file, so what
# is tested is what is deployed.

# HTTPS only, for a year, once the site has been reached over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# A downloaded file is never re-interpreted as a script or a page.
add_header X-Content-Type-Options "nosniff" always;

# No other site may frame this one (clickjacking); frame-ancestors below says the same to newer browsers.
add_header X-Frame-Options "DENY" always;

# Addresses inside the app (they carry ids) are not sent to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Location is for punching in from the office; nothing else is ever asked for.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# What the page may load, and from where:
#   script-src 'self'          only the app's own built files — no inline script, no eval
#   style-src 'unsafe-inline'  the toast library writes its own <style>; styles cannot run code
#   fonts.googleapis/gstatic   the Inter font (index.html)
#   img-src data: blob:        icons, and photos of documents previewed in the page
#   frame-src/object-src blob: PDFs previewed inside the page are blob: frames, and
#                              the browser's PDF viewer inherits this policy
#   connect-src 'self'         the API is on the same address — nowhere else
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
